spring.application.name=productos
server.port=8081
server.servlet.context-path=/

# Database Configuration - PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/licores
spring.datasource.username=postgres
spring.datasource.password=Lu246988
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# JPA and Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.generate_statistics=false

# JWT Configuration
jwt.secret=my-super-secret-key-that-should-be-at-least-256-bits-long-for-hs256-algorithm-change-this-in-production
jwt.expiration=86400000

# Logging Configuration
logging.level.root=INFO
logging.level.com.ventas.productos=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Server Configuration
server.compression.enabled=true
server.compression.min-response-size=1024